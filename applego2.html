<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Apple Go Pirated · Manga & Watch</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0c10;
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, 'Roboto', sans-serif;
      color: #f0f3fa;
      line-height: 1.5;
    }

    /* header / brand */
    .header {
      background: linear-gradient(135deg, #0f212e 0%, #0a121c 100%);
      border-bottom: 2px solid #ffb347;
      padding: 1rem 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .logo h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffb347, #ff8c42);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 2px 3px rgba(0,0,0,0.2);
    }

    .logo p {
      font-size: 0.75rem;
      color: #9aaebf;
      margin-top: 4px;
      font-style: italic;
    }

    .mode-switch {
      display: flex;
      gap: 1rem;
      background: #1e2a32;
      padding: 0.4rem 1rem;
      border-radius: 60px;
    }

    .mode-btn {
      background: none;
      border: none;
      font-weight: bold;
      font-size: 1.1rem;
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #bbd4f0;
    }

    .mode-btn.active {
      background: #ff8c42;
      color: #0a0c10;
      box-shadow: 0 4px 12px rgba(255,140,66,0.5);
    }

    /* main container */
    .container {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    /* search + library header */
    .library-header {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      align-items: center;
    }

    .library-header h2 {
      font-size: 1.8rem;
      font-weight: 600;
      border-left: 5px solid #ffb347;
      padding-left: 1rem;
    }

    .search-box {
      display: flex;
      background: #1e2a32;
      border-radius: 48px;
      overflow: hidden;
      border: 1px solid #2e3e48;
    }

    .search-box input {
      background: transparent;
      border: none;
      padding: 0.7rem 1.2rem;
      width: 220px;
      color: white;
      font-size: 0.9rem;
      outline: none;
    }

    .search-box button {
      background: #ff8c42;
      border: none;
      padding: 0 1.2rem;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      color: #111;
    }

    /* content grid */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.8rem;
      margin: 2rem 0;
    }

    /* card styling - each card now has a beautiful image */
    .card {
      background: #141e26;
      border-radius: 1.5rem;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      border: 1px solid #2c3a44;
      box-shadow: 0 8px 18px rgba(0,0,0,0.3);
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 28px rgba(0,0,0,0.5);
      border-color: #ffb347;
    }

    .card-img {
      width: 100%;
      height: 210px;
      background-size: cover;
      background-position: center;
      background-color: #1f2e38;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      transition: transform 0.3s ease;
    }

    .card:hover .card-img {
      transform: scale(1.02);
    }

    .badge {
      background: #ff8c42cc;
      backdrop-filter: blur(4px);
      padding: 0.25rem 0.9rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: bold;
      margin: 12px;
      color: #111;
      letter-spacing: 0.3px;
    }

    .card-info {
      padding: 1rem;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      display: flex;
      justify-content: space-between;
      color: #ffd7a5;
    }

    .card-desc {
      font-size: 0.8rem;
      color: #b9d0e3;
      margin-top: 6px;
      line-height: 1.4;
    }

    /* viewer panel (reader / player) */
    .viewer-panel {
      background: #0f171f;
      border-radius: 2rem;
      margin-top: 2.5rem;
      border: 1px solid #2c3e4e;
      overflow: hidden;
      transition: all 0.2s;
    }

    .viewer-header {
      background: #101e26;
      padding: 0.8rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2f4558;
      flex-wrap: wrap;
    }

    .viewer-title {
      font-weight: bold;
      font-size: 1.2rem;
    }

    .close-viewer {
      background: none;
      border: none;
      color: #ffb347;
      font-size: 1.4rem;
      cursor: pointer;
      font-weight: bold;
    }

    .viewer-content {
      padding: 1.8rem;
      min-height: 480px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #03090e;
    }

    /* manga reader (image based) */
    .manga-viewer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      width: 100%;
    }

    .manga-page {
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 5px 20px black;
    }

    .page-nav {
      display: flex;
      gap: 1rem;
      margin: 1rem 0;
    }

    .page-nav button, .watch-btn {
      background: #2c3f4c;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.1s;
    }

    .page-nav button:active, .watch-btn:active {
      transform: scale(0.97);
    }

    /* anime video player */
    .video-container {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    video {
      width: 100%;
      max-width: 900px;
      border-radius: 24px;
      outline: none;
      box-shadow: 0 15px 30px rgba(0,0,0,0.6);
    }

    .episode-selector {
      margin-top: 1rem;
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .ep-btn {
      background: #1e2f3a;
      border: none;
      padding: 0.3rem 1rem;
      border-radius: 30px;
      color: #f0e6d0;
      cursor: pointer;
    }

    .ep-btn.active-ep {
      background: #ff8c42;
      color: black;
      font-weight: bold;
    }

    .no-data {
      text-align: center;
      padding: 3rem;
      color: #9aaebf;
    }

    footer {
      text-align: center;
      margin: 3rem 0 1rem;
      font-size: 0.75rem;
      color: #4a6272;
    }

    @media (max-width: 650px) {
      .header {
        flex-direction: column;
        gap: 0.8rem;
        align-items: center;
      }
      .viewer-content {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
<div class="header">
  <div class="logo">
    <h1>🍎 Apple Go Pirated</h1>
    <p>stream • read • sail the high seas</p>
  </div>
  <div class="mode-switch">
    <button class="mode-btn active" data-mode="manga">📚 MANGA</button>
    <button class="mode-btn" data-mode="anime">🎬 ANIME</button>
  </div>
</div>

<div class="container">
  <div class="library-header">
    <h2 id="libraryLabel">📖 Manga Library</h2>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search title...">
      <button id="searchBtn">🔍</button>
    </div>
  </div>

  <!-- dynamic grid with cards each having unique picture -->
  <div id="mediaGrid" class="media-grid"></div>

  <!-- viewer panel (hidden by default) -->
  <div id="viewerPanel" class="viewer-panel" style="display: none;">
    <div class="viewer-header">
      <span class="viewer-title" id="viewerTitle">Now Playing</span>
      <button class="close-viewer" id="closeViewerBtn">✕ CLOSE</button>
    </div>
    <div class="viewer-content" id="viewerContent">
      <!-- dynamic content: manga pages or video -->
    </div>
  </div>
  <footer>⚓ For otakus & pirates — all content is fan-made preview. Support official releases.</footer>
</div>

<script>
  // ============================================================
  // UNIQUE PREVIEW IMAGES FOR EVERY CARD (manga + anime)
  // Each entry has a custom, high-quality cover that makes the card shine.
  // Added two requested stories with distinct visuals.
  // ============================================================

  // MANGA COLLECTION - every manga has its own unique preview image
  const mangaCollection = [
    { 
      id: 1, 
      title: "The Secret Chubby Soldier", 
      cover: "https://picsum.photos/id/159/400/300",  // unique: old military style
      description: "An underestimated chubby spy infiltrates enemy lines, uses wits to stop war — a thrilling action comedy that will make you laugh and cheer.", 
      pages: 14, 
      genre: "spy-action" 
    },
    { 
      id: 2, 
      title: "The Working Student Millionaire", 
      cover: "https://picsum.photos/id/26/400/300",   // unique: student with books
      description: "He works double shifts, never complains about grad fees — nobody knows he's a secret millionaire. Heartwarming and inspiring slice of life.", 
      pages: 12, 
      genre: "slice of life" 
    },
    { 
      id: 3, 
      title: "Naruto Shippuden", 
      cover: "https://picsum.photos/id/104/400/300",  // dynamic landscape
      description: "The tale of Naruto Uzumaki, ninja way! Epic battles and friendship.", 
      pages: 12, 
      genre: "action" 
    },
    { 
      id: 4, 
      title: "One Piece", 
      cover: "https://picsum.photos/id/15/400/300",   // ocean vibes
      description: "Monkey D. Luffy's journey to become Pirate King. Adventure on the grand line!", 
      pages: 15, 
      genre: "adventure" 
    },
    { 
      id: 5, 
      title: "Attack on Titan", 
      cover: "https://picsum.photos/id/96/400/300",   // dramatic monolith
      description: "Humanity vs Titans, dark fantasy. The walls will never be the same.", 
      pages: 10, 
      genre: "dark" 
    },
    { 
      id: 6, 
      title: "Jujutsu Kaisen", 
      cover: "https://picsum.photos/id/29/400/300",   // mysterious architecture
      description: "Curses & sorcery at full throttle. Itadori's wild journey begins.", 
      pages: 8, 
      genre: "supernatural" 
    },
    { 
      id: 7, 
      title: "Demon Slayer", 
      cover: "https://picsum.photos/id/58/400/300",   // zen forest
      description: "Tanjiro's path to save his sister. Breathtaking water breathing techniques.", 
      pages: 14, 
      genre: "action" 
    }
  ];

  // ANIME COLLECTION - every anime has its own unique preview image (including the two new stories)
  const animeCollection = [
    { 
      id: 101, 
      title: "The Secret Chubby Soldier", 
      cover: "https://picsum.photos/id/160/400/300",  // distinct: rugged but funny
      description: "Anime version: Chubby hero stops war with clever spy tactics — action-packed and hilarious! A must-watch.", 
      episodes: 3, 
      currentEp: 1 
    },
    { 
      id: 102, 
      title: "Working Student Millionaire", 
      cover: "https://picsum.photos/id/20/400/300",   // coffee shop vibe
      description: "Anime: The secret wealthy student who quietly pays his fees and changes lives. Emotional and uplifting.", 
      episodes: 2, 
      currentEp: 1 
    },
    { 
      id: 103, 
      title: "Spy x Family", 
      cover: "https://picsum.photos/id/152/400/300",  // elegant family theme
      description: "Secret agent + telepath + assassin = family fun! The Forgers at their best.", 
      episodes: 3, 
      currentEp: 1 
    },
    { 
      id: 104, 
      title: "Chainsaw Man", 
      cover: "https://picsum.photos/id/42/400/300",   // gritty industrial
      description: "Devil hunter Denji with chainsaw powers. Violent, chaotic, legendary.", 
      episodes: 2, 
      currentEp: 1 
    },
    { 
      id: 105, 
      title: "Vinland Saga", 
      cover: "https://picsum.photos/id/47/400/300",   // nordic sea vibes
      description: "Viking epic about revenge and peace. A true warrior's saga.", 
      episodes: 2, 
      currentEp: 1 
    },
    { 
      id: 106, 
      title: "My Hero Academia", 
      cover: "https://picsum.photos/id/100/400/300",  // cityscape
      description: "Quirks, heroes, and One For All. Go beyond! PLUS ULTRA.", 
      episodes: 3, 
      currentEp: 1 
    }
  ];

  // Helper to get manga page image for specific manga id and page number (1-indexed)
  // Special flavor for the new stories
  function getMangaPageUrl(mangaId, pageNum) {
    // For the two original stories, give a bit more unique page art
    if (mangaId === 1) {
      let seeds = [155, 227, 333, 440, 512, 623, 777, 888, 999, 1010, 1122, 1234, 1345, 1400];
      let seed = seeds[(pageNum - 1) % seeds.length];
      return `https://picsum.photos/id/${seed}/800/1100?grayscale&seed=chubby-${pageNum}`;
    } else if (mangaId === 2) {
      let seeds = [88, 176, 264, 352, 468, 555, 643, 731, 819, 907, 1003, 1150];
      let seed = seeds[(pageNum - 1) % seeds.length];
      return `https://picsum.photos/id/${seed}/800/1100?grayscale&seed=student-${pageNum}`;
    }
    // default for classic manga
    let seed = (mangaId * 77 + pageNum * 33) % 999;
    return `https://picsum.photos/id/${seed + 50}/800/1100?grayscale&seed=${mangaId}-${pageNum}`;
  }

  // For anime episodes we use safe sample video URLs (mp4) (big buck bunny, sintel, etc)
  function getEpisodeVideoUrl(animeId, episodeNumber) {
    const videoPool = [
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFunflies.mp4",
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4",
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/SubaruOutbackOnStreetAndDirt.mp4"
    ];
    let idx = (animeId * 13 + episodeNumber * 7) % videoPool.length;
    return videoPool[idx];
  }

  // ---------- Global State ----------
  let currentMode = "manga";
  let searchQuery = "";
  let activeViewerItem = null;

  // DOM elements
  const mediaGrid = document.getElementById("mediaGrid");
  const libraryLabel = document.getElementById("libraryLabel");
  const searchInput = document.getElementById("searchInput");
  const searchBtn = document.getElementById("searchBtn");
  const viewerPanel = document.getElementById("viewerPanel");
  const viewerTitleSpan = document.getElementById("viewerTitle");
  const viewerContentDiv = document.getElementById("viewerContent");
  const closeViewerBtn = document.getElementById("closeViewerBtn");
  const modeBtns = document.querySelectorAll(".mode-btn");

  // Filter items by title
  function filterItems(items) {
    if (!searchQuery.trim()) return items;
    return items.filter(item => item.title.toLowerCase().includes(searchQuery.toLowerCase()));
  }

  // Render grid: every card shows its unique picture stored in the 'cover' field
  function renderGrid() {
    if (currentMode === "manga") {
      const filtered = filterItems(mangaCollection);
      libraryLabel.innerText = "📖 Manga Library";
      if (filtered.length === 0) {
        mediaGrid.innerHTML = `<div class="no-data">🏴‍☠️ No manga found for "${searchQuery}"</div>`;
        return;
      }
      mediaGrid.innerHTML = filtered.map(manga => `
        <div class="card" data-id="${manga.id}" data-type="manga" data-title="${escapeHtml(manga.title)}" data-pages="${manga.pages}" data-desc="${escapeHtml(manga.description)}" data-cover="${manga.cover}">
          <div class="card-img" style="background-image: url('${manga.cover}'); background-size: cover; background-position: center;">
            <span class="badge">📘 ${manga.pages} pages</span>
          </div>
          <div class="card-info">
            <div class="card-title">${escapeHtml(manga.title)}</div>
            <div class="card-desc">${escapeHtml(manga.description.substring(0, 90))}${manga.description.length > 90 ? '…' : ''}</div>
          </div>
        </div>
      `).join('');
    } 
    else { // anime mode
      const filtered = filterItems(animeCollection);
      libraryLabel.innerText = "🎬 Anime Library";
      if (filtered.length === 0) {
        mediaGrid.innerHTML = `<div class="no-data">💀 No anime found for "${searchQuery}"</div>`;
        return;
      }
      mediaGrid.innerHTML = filtered.map(anime => `
        <div class="card" data-id="${anime.id}" data-type="anime" data-title="${escapeHtml(anime.title)}" data-episodes="${anime.episodes}" data-desc="${escapeHtml(anime.description)}" data-cover="${anime.cover}">
          <div class="card-img" style="background-image: url('${anime.cover}'); background-size: cover; background-position: center;">
            <span class="badge">🎞️ ${anime.episodes} eps</span>
          </div>
          <div class="card-info">
            <div class="card-title">${escapeHtml(anime.title)}</div>
            <div class="card-desc">${escapeHtml(anime.description.substring(0, 90))}${anime.description.length > 90 ? '…' : ''}</div>
          </div>
        </div>
      `).join('');
    }
    attachCardEvents();
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function attachCardEvents() {
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', (e) => {
        const type = card.dataset.type;
        const id = parseInt(card.dataset.id);
        const title = card.dataset.title;
        if (type === "manga") {
          const pages = parseInt(card.dataset.pages);
          let mangaItem = mangaCollection.find(m => m.id === id);
          if (!mangaItem) {
            mangaItem = { id, title, pages, description: card.dataset.desc };
          }
          openMangaViewer(mangaItem, pages);
        } else if (type === "anime") {
          const episodes = parseInt(card.dataset.episodes);
          let animeItem = animeCollection.find(a => a.id === id);
          if (!animeItem) {
            animeItem = { id, title, episodes, description: card.dataset.desc };
          }
          openAnimeViewer(animeItem, episodes);
        }
      });
    });
  }

  // MANGA VIEWER
  function openMangaViewer(manga, totalPages) {
    activeViewerItem = {
      type: "manga",
      data: manga,
      totalPages: totalPages,
      currentPage: 1
    };
    viewerTitleSpan.innerText = `📖 ${manga.title} - reading mode`;
    viewerPanel.style.display = "block";
    renderMangaContent(manga, activeViewerItem.currentPage, totalPages);
  }

  function renderMangaContent(manga, pageNum, totalPages) {
    const pageUrl = getMangaPageUrl(manga.id, pageNum);
    viewerContentDiv.innerHTML = `
      <div class="manga-viewer">
        <img class="manga-page" src="${pageUrl}" alt="Manga page ${pageNum}" onerror="this.src='https://picsum.photos/id/1/800/1100?grayscale';">
        <div class="page-nav">
          <button id="prevPageBtn" ${pageNum === 1 ? 'disabled' : ''}>◀ PREV</button>
          <span style="background:#1e2f3a; padding:0.3rem 1rem; border-radius:30px;">Page ${pageNum} / ${totalPages}</span>
          <button id="nextPageBtn" ${pageNum === totalPages ? 'disabled' : ''}>NEXT ▶</button>
        </div>
        <p style="font-size:0.7rem; margin-top:0.5rem;">✨ Fan scanlation — enjoy the unique story!</p>
      </div>
    `;
    const prevBtn = document.getElementById("prevPageBtn");
    const nextBtn = document.getElementById("nextPageBtn");
    if (prevBtn) prevBtn.onclick = () => {
      if (activeViewerItem.currentPage > 1) {
        activeViewerItem.currentPage--;
        renderMangaContent(manga, activeViewerItem.currentPage, totalPages);
      }
    };
    if (nextBtn) nextBtn.onclick = () => {
      if (activeViewerItem.currentPage < totalPages) {
        activeViewerItem.currentPage++;
        renderMangaContent(manga, activeViewerItem.currentPage, totalPages);
      }
    };
  }

  // ANIME VIEWER with episode selector
  function openAnimeViewer(anime, totalEpisodes) {
    activeViewerItem = {
      type: "anime",
      data: anime,
      totalEpisodes: totalEpisodes,
      currentEpisode: 1
    };
    viewerTitleSpan.innerText = `🎬 ${anime.title} - streaming`;
    viewerPanel.style.display = "block";
    renderAnimeContent(anime, activeViewerItem.currentEpisode, totalEpisodes);
  }

  function renderAnimeContent(anime, episodeNum, totalEpisodes) {
    const videoSrc = getEpisodeVideoUrl(anime.id, episodeNum);
    let epsButtons = '';
    for (let i = 1; i <= totalEpisodes; i++) {
      epsButtons += `<button class="ep-btn ${i === episodeNum ? 'active-ep' : ''}" data-ep="${i}">Ep ${i}</button>`;
    }
    viewerContentDiv.innerHTML = `
      <div style="width:100%; text-align:center;">
        <div class="video-container">
          <video controls autoplay key="${videoSrc}" width="100%">
            <source src="${videoSrc}" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        </div>
        <div class="episode-selector" id="episodeSelector">
          ${epsButtons}
        </div>
        <p style="margin-top:12px; font-size:0.8rem;">⚡ Episode ${episodeNum} · streaming free</p>
        <p style="font-size:0.7rem; opacity:0.7;">🏴‍☠️ ahoy! enjoy the show</p>
      </div>
    `;
    const epsContainer = document.getElementById("episodeSelector");
    if (epsContainer) {
      const allEpBtns = epsContainer.querySelectorAll(".ep-btn");
      allEpBtns.forEach(btn => {
        btn.addEventListener("click", (e) => {
          const newEp = parseInt(btn.dataset.ep);
          if (!isNaN(newEp) && newEp !== activeViewerItem.currentEpisode) {
            activeViewerItem.currentEpisode = newEp;
            renderAnimeContent(anime, newEp, totalEpisodes);
          }
        });
      });
    }
    const videoElem = viewerContentDiv.querySelector("video");
    if (videoElem) {
      videoElem.load();
      videoElem.play().catch(e => console.log("autoplay needs user interaction first"));
    }
  }

  function closeViewer() {
    viewerPanel.style.display = "none";
    viewerContentDiv.innerHTML = "";
    activeViewerItem = null;
  }

  function setMode(mode) {
    currentMode = mode;
    modeBtns.forEach(btn => {
      if (btn.dataset.mode === mode) btn.classList.add("active");
      else btn.classList.remove("active");
    });
    renderGrid();
    if (viewerPanel.style.display === "block") closeViewer();
  }

  function performSearch() {
    searchQuery = searchInput.value.trim();
    renderGrid();
    if (viewerPanel.style.display === "block") closeViewer();
  }

  // Event listeners
  modeBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      setMode(btn.dataset.mode);
    });
  });

  searchBtn.addEventListener("click", performSearch);
  searchInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") performSearch();
  });
  closeViewerBtn.addEventListener("click", closeViewer);

  // initial render
  renderGrid();
</script>
</body>
</html>
