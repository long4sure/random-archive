<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoreERP — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    :root { --accent: #1E4FA8; --accent2: #2563EB; }
    .login-page { background: linear-gradient(135deg, #EEF5FF 0%, #DCEEFF 100%); }
    .login-card { border-top: 3px solid #1E4FA8; }
    .btn.primary { background: #1E4FA8; border-color: #1E4FA8; }
    .btn.primary:hover { background: #163D88; border-color: #163D88; }
    input:focus { border-color: #1E4FA8; box-shadow: 0 0 0 3px rgba(30,79,168,.1); }
    .login-footer a { color: #1E4FA8; }
  </style>
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div class="login-logo">
      <div class="logo-icon">🏪</div>
      <h1>StoreERP</h1>
      <p>Retail & Sari-sari Store Management</p>
    </div>
    <div class="card login-card">
      <h2 id="form-title">Sign in to your account</h2>
      <div class="login-error" id="login-error"></div>

      <div id="login-form">
        <div class="form-group" style="margin-bottom:14px">
          <label>Email</label>
          <input type="email" id="email" placeholder="you@example.com">
        </div>
        <div class="form-group" style="margin-bottom:20px">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••">
        </div>
        <button class="btn primary" id="login-btn" onclick="handleLogin()" style="width:100%;justify-content:center;padding:10px">Sign in</button>
      </div>

      <div id="register-form" style="display:none">
        <div class="form-group" style="margin-bottom:14px">
          <label>Your name</label>
          <input type="text" id="reg-name" placeholder="Juan dela Cruz">
        </div>
        <div class="form-group" style="margin-bottom:14px">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="you@example.com">
        </div>
        <div class="form-group" style="margin-bottom:20px">
          <label>Password</label>
          <input type="password" id="reg-password" placeholder="Min 6 characters">
        </div>
        <button class="btn primary" id="register-btn" onclick="handleRegister()" style="width:100%;justify-content:center;padding:10px">Create account</button>
      </div>

      <div class="login-footer">
        <span id="toggle-text">Don't have an account?</span>
        <a href="#" id="toggle-link" onclick="toggleMode(event)"> Register</a>
      </div>
    </div>
    <div style="text-align:center;margin-top:16px">
      <a href="../index.html" style="font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:4px">
        <i class="ti ti-arrow-left"></i> Back to home
      </a>
    </div>
  </div>
</div>

<script type="module">
  import { signIn, signUp, redirectIfAuth, showError, hideError } from '../js/supabase.js'
  await redirectIfAuth('dashboard.html')
  let isRegister = false

  window.toggleMode = (e) => {
    e.preventDefault(); isRegister = !isRegister
    document.getElementById('login-form').style.display = isRegister ? 'none' : 'block'
    document.getElementById('register-form').style.display = isRegister ? 'block' : 'none'
    document.getElementById('form-title').textContent = isRegister ? 'Create your account' : 'Sign in to your account'
    document.getElementById('toggle-text').textContent = isRegister ? 'Already have an account?' : "Don't have an account?"
    document.getElementById('toggle-link').textContent = isRegister ? ' Sign in' : ' Register'
    hideError('login-error')
  }

  window.handleLogin = async () => {
    const email = document.getElementById('email').value.trim()
    const password = document.getElementById('password').value
    if (!email || !password) { showError('login-error', 'Please fill in all fields'); return }
    const btn = document.getElementById('login-btn')
    btn.disabled = true; btn.textContent = 'Signing in…'
    try { await signIn(email, password); window.location.href = 'dashboard.html' }
    catch(e) { showError('login-error', e.message); btn.disabled = false; btn.textContent = 'Sign in' }
  }

  window.handleRegister = async () => {
    const name = document.getElementById('reg-name').value.trim()
    const email = document.getElementById('reg-email').value.trim()
    const password = document.getElementById('reg-password').value
    if (!name || !email || !password) { showError('login-error', 'Please fill in all fields'); return }
    const btn = document.getElementById('register-btn')
    btn.disabled = true; btn.textContent = 'Creating account…'
    try { await signUp(email, password, name); window.location.href = 'dashboard.html' }
    catch(e) { showError('login-error', e.message); btn.disabled = false; btn.textContent = 'Create account' }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') isRegister ? window.handleRegister() : window.handleLogin()
  })
</script>
</body>
</html>
