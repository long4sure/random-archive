<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERP — BizSuite</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header class="app-header"><nav id="app-nav"></nav></header>
  <main class="container">
    <h1 class="page-title">ERP — Inventory & Orders</h1>
    <div class="stats-row" id="erp-stats"></div>

    <section class="panel">
      <div class="panel-header">
        <h2><span id="h-products"></span> Products</h2>
      </div>
      <form class="inline-form" id="form-product">
        <div><label>SKU</label><input name="sku" required placeholder="SKU-001" /></div>
        <div><label>Name</label><input name="name" required placeholder="Widget" /></div>
        <div><label>Qty</label><input name="quantity" type="number" min="0" value="0" /></div>
        <div><label>Unit price</label><input name="unit_price" type="number" min="0" step="0.01" value="0" /></div>
        <button type="submit" class="btn btn--primary" id="btn-add-product"></button>
      </form>
      <div id="products-table" style="margin-top:1rem"></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2><span id="h-orders"></span> Orders</h2>
      </div>
      <form class="inline-form" id="form-order">
        <div><label>Order #</label><input name="order_number" required placeholder="ORD-1001" /></div>
        <div><label>Status</label>
          <select name="status">
            <option value="draft">Draft</option>
            <option value="confirmed">Confirmed</option>
            <option value="shipped">Shipped</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <div><label>Total</label><input name="total_amount" type="number" min="0" step="0.01" value="0" /></div>
        <div><label>Notes</label><input name="notes" placeholder="Optional" /></div>
        <button type="submit" class="btn btn--primary" id="btn-add-order"></button>
      </form>
      <div id="orders-table" style="margin-top:1rem"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/paths.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="erp.js"></script>
</body>
</html>
