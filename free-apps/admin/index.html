<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — BizSuite</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header class="app-header"><nav id="app-nav"></nav></header>
  <main class="container">
    <h1 class="page-title">Admin — Site monitoring</h1>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
      View all users and activity across ERP, POS, and CRM. Only accounts with the admin role can access this page.
    </p>

    <div class="stats-row" id="admin-stats"></div>

    <section class="panel">
      <h2 id="h-users"></h2>
      <div id="users-table"></div>
    </section>

    <section class="panel">
      <h2 id="h-activity"></h2>
      <div id="activity-table"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/paths.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="admin.js"></script>
</body>
</html>
