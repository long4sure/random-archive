<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — BizSuite</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="back-link" id="back-home"></a>
    <div class="badge-system" id="system-badge" hidden></div>
    <h1>Sign in</h1>
    <p class="subtitle">Use your password or a one-time code sent to your email.</p>

    <div class="auth-tabs">
      <button type="button" class="auth-tab auth-tab--active" data-tab="password">Password</button>
      <button type="button" class="auth-tab" data-tab="otp">Email OTP</button>
    </div>

    <form id="form-password">
      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-wrap">
          <span class="icon" id="i-mail"></span>
          <input type="email" id="email" required autocomplete="email" placeholder="you@company.com" />
        </div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <span class="icon" id="i-lock"></span>
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" />
        </div>
      </div>
      <button type="submit" class="btn btn--primary" id="btn-login-pw"></button>
    </form>

    <form id="form-otp" hidden>
      <div class="form-group">
        <label for="email-otp">Email</label>
        <div class="input-wrap">
          <span class="icon" id="i-mail2"></span>
          <input type="email" id="email-otp" required placeholder="you@company.com" />
        </div>
      </div>
      <button type="submit" class="btn btn--primary" id="btn-send-otp"></button>
    </form>

    <p class="auth-footer">
      No account? <a href="#" id="link-register">Create one</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/paths.js"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const system = params.get("system") || getSelectedSystem();
    if (system) {
      setSelectedSystem(system);
      const badge = document.getElementById("system-badge");
      badge.hidden = false;
      badge.innerHTML = `${icon(system)} Accessing ${systemLabel(system)}`;
    }

    document.getElementById("back-home").innerHTML = `${icon("arrowLeft")} Back`;
    document.getElementById("back-home").href = appUrl("index.html");
    document.getElementById("i-mail").innerHTML = BizIcons.mail;
    document.getElementById("i-mail2").innerHTML = BizIcons.mail;
    document.getElementById("i-lock").innerHTML = BizIcons.lock;
    document.getElementById("btn-login-pw").innerHTML = `${icon("logIn")} Sign in`;
    document.getElementById("btn-send-otp").innerHTML = `${icon("mail")} Send login code`;

    document.getElementById("link-register").href =
      appUrl(`register.html${system ? `?system=${system}` : ""}`);

    document.querySelectorAll(".auth-tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".auth-tab").forEach((t) => t.classList.remove("auth-tab--active"));
        tab.classList.add("auth-tab--active");
        const isOtp = tab.dataset.tab === "otp";
        document.getElementById("form-password").hidden = isOtp;
        document.getElementById("form-otp").hidden = !isOtp;
      });
    });

    document.getElementById("form-password").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn-login-pw");
      btn.disabled = true;
      try {
        await signInWithPassword(
          document.getElementById("email").value,
          document.getElementById("password").value
        );
        await redirectAfterAuth();
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById("form-otp").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn-send-otp");
      btn.disabled = true;
      try {
        const email = document.getElementById("email-otp").value;
        await sendAuthOtp(email);
        sessionStorage.setItem("biz_otp_login_email", email);
        location.href = appUrl(`verify-otp.html?purpose=login${system ? `&system=${system}` : ""}`);
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        btn.disabled = false;
      }
    });

    getSession().then((s) => { if (s) redirectAfterAuth(); });
  </script>
</body>
</html>
